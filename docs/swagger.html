<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Wara API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; }
    .swagger-ui .topbar { background-color: #18181b; }
    .swagger-ui .topbar .download-url-wrapper { display: none; }
  </style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
const spec = {
  openapi: "3.0.3",
  info: {
    title: "Wara API",
    version: "1.0.0",
    description: "Wara 서비스 REST API 문서\n\n모든 응답은 Envelope 패턴을 따릅니다.\n- 성공: `{ success: true, data: ... }`\n- 목록: `{ success: true, data: [...], meta: { total, page, limit, totalPages } }`\n- 에러: `{ success: false, error: { code, message, details? } }`"
  },
  servers: [{ url: "/api/v1", description: "API 서버" }],
  security: [{ BearerAuth: [] }],
  tags: [
    { name: "Auth", description: "인증" },
    { name: "Users", description: "유저" },
    { name: "Invitation Templates", description: "초대장 템플릿" },
    { name: "Invitations", description: "초대장" },
    { name: "Event Location", description: "행사 장소" },
    { name: "Participants", description: "참가자" },
    { name: "Invitation Send Logs", description: "초대 전송 이력" },
    { name: "Missions", description: "미션" },
    { name: "Participant Locations", description: "참가자 위치" },
    { name: "Photos", description: "사진" },
    { name: "Feedbacks", description: "피드백 (댓글)" },
    { name: "Notifications", description: "알림" }
  ],
  components: {
    securitySchemes: {
      BearerAuth: { type: "http", scheme: "bearer", bearerFormat: "JWT" }
    },
    schemas: {
      ApiError: {
        type: "object",
        properties: {
          success: { type: "boolean", example: false },
          error: {
            type: "object",
            properties: {
              code: { type: "string", example: "NOT_FOUND" },
              message: { type: "string", example: "리소스를 찾을 수 없습니다" },
              details: {
                type: "array",
                items: {
                  type: "object",
                  properties: {
                    field: { type: "string" },
                    message: { type: "string" }
                  }
                }
              }
            }
          }
        }
      },
      ApiMeta: {
        type: "object",
        properties: {
          total: { type: "integer", example: 100 },
          page: { type: "integer", example: 1 },
          limit: { type: "integer", example: 20 },
          totalPages: { type: "integer", example: 5 }
        }
      },
      User: {
        type: "object",
        properties: {
          id: { type: "string", example: "01HV..." },
          email: { type: "string", format: "email", nullable: true },
          profileImageUrl: { type: "string", nullable: true },
          name: { type: "string", nullable: true },
          nickname: { type: "string", maxLength: 8, nullable: true },
          birthYear: { type: "integer", nullable: true },
          gender: { type: "string", enum: ["female", "male"], nullable: true },
          role: { type: "string", enum: ["member", "admin"] },
          lastLoginAt: { type: "string", format: "date-time", nullable: true },
          createdAt: { type: "string", format: "date-time" },
          updatedAt: { type: "string", format: "date-time" }
        }
      },
      SocialAccount: {
        type: "object",
        properties: {
          id: { type: "string" },
          userId: { type: "string" },
          provider: { type: "string", enum: ["kakao", "naver", "apple"] },
          providerAccountId: { type: "string" },
          createdAt: { type: "string", format: "date-time" },
          updatedAt: { type: "string", format: "date-time" }
        }
      },
      InvitationTemplate: {
        type: "object",
        properties: {
          id: { type: "string" },
          name: { type: "string" },
          previewImageKey: { type: "string" },
          theme: { type: "string" },
          font: { type: "string" },
          effect: { type: "string", nullable: true },
          isActive: { type: "boolean" },
          createdAt: { type: "string", format: "date-time" },
          updatedAt: { type: "string", format: "date-time" }
        }
      },
      Invitation: {
        type: "object",
        properties: {
          id: { type: "string" },
          userId: { type: "string" },
          templateId: { type: "string", nullable: true },
          status: { type: "string", enum: ["active", "closed"] },
          title: { type: "string" },
          description: { type: "string" },
          mainImageKey: { type: "string" },
          eventStartAt: { type: "string", format: "date-time", nullable: true },
          isMissionEnabled: { type: "boolean" },
          createdAt: { type: "string", format: "date-time" },
          updatedAt: { type: "string", format: "date-time" }
        }
      },
      Participant: {
        type: "object",
        properties: {
          id: { type: "string" },
          userId: { type: "string" },
          invitationId: { type: "string" },
          memberRole: { type: "string", enum: ["HOST", "GUEST"] },
          rsvpStatus: { type: "string", enum: ["attending", "undecided", "absent", "cancelled"] },
          createdAt: { type: "string", format: "date-time" },
          updatedAt: { type: "string", format: "date-time" }
        }
      },
      InvitationSendLog: {
        type: "object",
        properties: {
          id: { type: "string" },
          invitationId: { type: "string" },
          senderId: { type: "string" },
          channel: { type: "string", enum: ["link", "kakao", "sms", "email", "dm"] },
          inviteUrl: { type: "string", nullable: true },
          status: { type: "string", enum: ["sent", "opened", "responded", "failed"] },
          createdAt: { type: "string", format: "date-time" }
        }
      },
      EventLocation: {
        type: "object",
        properties: {
          id: { type: "string" },
          invitationId: { type: "string" },
          address: { type: "string" },
          placeName: { type: "string" },
          detailAddress: { type: "string" },
          lat: { type: "number", format: "double" },
          lng: { type: "number", format: "double" },
          placeId: { type: "string" },
          createdAt: { type: "string", format: "date-time" },
          updatedAt: { type: "string", format: "date-time" }
        }
      },
      ParticipantLocation: {
        type: "object",
        properties: {
          id: { type: "string" },
          invitationId: { type: "string" },
          participantId: { type: "string" },
          accuracy: { type: "number" },
          lat: { type: "number", format: "double" },
          lng: { type: "number", format: "double" },
          isArrived: { type: "boolean" },
          createdAt: { type: "string", format: "date-time" },
          updatedAt: { type: "string", format: "date-time" }
        }
      },
      Mission: {
        type: "object",
        properties: {
          id: { type: "string" },
          invitationId: { type: "string" },
          participantId: { type: "string" },
          content: { type: "string" },
          createdAt: { type: "string", format: "date-time" }
        }
      },
      Photo: {
        type: "object",
        properties: {
          id: { type: "string" },
          participantId: { type: "string" },
          invitationId: { type: "string" },
          imageKey: { type: "string" },
          exifMetadata: { type: "object", nullable: true },
          viewCount: { type: "integer" },
          likeCount: { type: "integer" },
          createdAt: { type: "string", format: "date-time" },
          updatedAt: { type: "string", format: "date-time" }
        }
      },
      Feedback: {
        type: "object",
        properties: {
          id: { type: "string" },
          participantId: { type: "string" },
          invitationId: { type: "string", nullable: true },
          photoId: { type: "string", nullable: true },
          parentId: { type: "string", nullable: true },
          content: { type: "string" },
          likeCount: { type: "integer" },
          createdAt: { type: "string", format: "date-time" },
          updatedAt: { type: "string", format: "date-time" }
        }
      },
      Notification: {
        type: "object",
        properties: {
          id: { type: "string" },
          userId: { type: "string" },
          actorUserId: { type: "string", nullable: true },
          type: { type: "string", enum: ["remind", "participantLocations", "eventLocations", "feedback", "invitation_date", "photo"] },
          content: { type: "string" },
          targetType: { type: "string", enum: ["photo", "feedback", "invitation", "mission", "participantLocations"], nullable: true },
          targetId: { type: "string", nullable: true },
          isRead: { type: "boolean" },
          readAt: { type: "string", format: "date-time", nullable: true },
          createdAt: { type: "string", format: "date-time" }
        }
      },
      NotificationSettings: {
        type: "object",
        properties: {
          id: { type: "string" },
          userId: { type: "string" },
          isRemind: { type: "boolean" },
          isFeedback: { type: "boolean" },
          isInvitationDate: { type: "boolean" },
          isPhoto: { type: "boolean" },
          isMission: { type: "boolean" },
          isParticipantLocations: { type: "boolean" },
          isEventLocations: { type: "boolean" },
          createdAt: { type: "string", format: "date-time" },
          updatedAt: { type: "string", format: "date-time" }
        }
      }
    },
    responses: {
      Unauthorized: {
        description: "인증 필요",
        content: { "application/json": { schema: { "$ref": "#/components/schemas/ApiError" } } }
      },
      Forbidden: {
        description: "권한 없음",
        content: { "application/json": { schema: { "$ref": "#/components/schemas/ApiError" } } }
      },
      NotFound: {
        description: "리소스를 찾을 수 없음",
        content: { "application/json": { schema: { "$ref": "#/components/schemas/ApiError" } } }
      },
      Conflict: {
        description: "이미 존재하는 리소스",
        content: { "application/json": { schema: { "$ref": "#/components/schemas/ApiError" } } }
      },
      BadRequest: {
        description: "잘못된 요청",
        content: { "application/json": { schema: { "$ref": "#/components/schemas/ApiError" } } }
      }
    },
    parameters: {
      invitationId: {
        name: "invitationId", in: "path", required: true,
        schema: { type: "string" }, description: "초대장 ID"
      },
      photoId: {
        name: "photoId", in: "path", required: true,
        schema: { type: "string" }, description: "사진 ID"
      },
      feedbackId: {
        name: "feedbackId", in: "path", required: true,
        schema: { type: "string" }, description: "피드백 ID"
      },
      pageQuery: {
        name: "page", in: "query", schema: { type: "integer", default: 1 }
      },
      limitQuery: {
        name: "limit", in: "query", schema: { type: "integer", default: 20 }
      }
    }
  },
  paths: {

    // ─── Auth ───────────────────────────────────────────────────────────
    "/auth/{provider}": {
      get: {
        tags: ["Auth"], summary: "Kakao / Naver 로그인 redirect", security: [],
        parameters: [
          { name: "provider", in: "path", required: true, schema: { type: "string", enum: ["kakao", "naver"] }, description: "소셜 로그인 제공자" }
        ],
        responses: {
          302: { description: "OAuth 제공자 로그인 페이지로 redirect" }
        }
      }
    },
    "/auth/{provider}/callback": {
      get: {
        tags: ["Auth"], summary: "Kakao / Naver OAuth callback", security: [],
        parameters: [
          { name: "provider", in: "path", required: true, schema: { type: "string", enum: ["kakao", "naver"] } },
          { name: "code", in: "query", required: true, schema: { type: "string" } },
          { name: "state", in: "query", required: true, schema: { type: "string" } }
        ],
        responses: {
          302: { description: "code + state 검증 후 JWT 발급, 프론트엔드로 redirect" },
          400: { "$ref": "#/components/responses/BadRequest" }
        }
      }
    },
    "/auth/apple/callback": {
      post: {
        tags: ["Auth"], summary: "Apple OAuth callback (Apple이 form-data로 POST)", security: [],
        requestBody: {
          required: true,
          content: {
            "application/x-www-form-urlencoded": {
              schema: {
                type: "object", required: ["code", "id_token"],
                properties: {
                  code: { type: "string" },
                  id_token: { type: "string" },
                  user: { type: "string", description: "JSON string. 최초 로그인 시에만 포함 (name, email)" },
                  state: { type: "string" }
                }
              }
            }
          }
        },
        responses: {
          302: { description: "JWT 발급, 프론트엔드로 redirect" },
          400: { "$ref": "#/components/responses/BadRequest" }
        }
      }
    },
    "/auth/logout": {
      post: {
        tags: ["Auth"], summary: "로그아웃",
        responses: {
          204: { description: "로그아웃 성공" },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/auth/refresh": {
      post: {
        tags: ["Auth"], summary: "토큰 갱신", security: [],
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object", required: ["refreshToken"],
                properties: { refreshToken: { type: "string" } }
              }
            }
          }
        },
        responses: {
          200: {
            description: "토큰 갱신 성공",
            content: {
              "application/json": {
                schema: {
                  type: "object",
                  properties: {
                    success: { type: "boolean", example: true },
                    data: {
                      type: "object",
                      properties: {
                        accessToken: { type: "string" },
                        refreshToken: { type: "string" }
                      }
                    }
                  }
                }
              }
            }
          },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },

    // ─── Users ──────────────────────────────────────────────────────────
    "/users/{id}": {
      get: {
        tags: ["Users"], summary: "다른 사용자 프로필 조회",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" }, description: "사용자 ID" }],
        responses: {
          200: {
            description: "성공 (id, nickname, profileImageUrl, name만 반환)",
            content: {
              "application/json": {
                schema: {
                  type: "object",
                  properties: {
                    success: { type: "boolean", example: true },
                    data: {
                      type: "object",
                      properties: {
                        id: { type: "string" },
                        nickname: { type: "string", nullable: true },
                        profileImageUrl: { type: "string", nullable: true },
                        name: { type: "string", nullable: true }
                      }
                    }
                  }
                }
              }
            }
          },
          401: { "$ref": "#/components/responses/Unauthorized" },
          404: { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/users/me": {
      get: {
        tags: ["Users"], summary: "내 프로필 조회",
        responses: {
          200: {
            description: "성공",
            content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean", example: true }, data: { "$ref": "#/components/schemas/User" } } } } }
          },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      },
      patch: {
        tags: ["Users"], summary: "내 프로필 수정",
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                properties: {
                  name: { type: "string", maxLength: 100 },
                  nickname: { type: "string", maxLength: 8 },
                  birthYear: { type: "integer" },
                  gender: { type: "string", enum: ["female", "male"] },
                  profileImageUrl: { type: "string" }
                }
              }
            }
          }
        },
        responses: {
          200: {
            description: "수정 성공",
            content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean", example: true }, data: { "$ref": "#/components/schemas/User" } } } } }
          },
          400: { "$ref": "#/components/responses/BadRequest" },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      },
      delete: {
        tags: ["Users"], summary: "회원 탈퇴 (soft delete)",
        responses: {
          204: { description: "탈퇴 성공" },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/users/me/socials": {
      get: {
        tags: ["Users"], summary: "연결된 소셜 계정 목록",
        responses: {
          200: {
            description: "성공",
            content: {
              "application/json": {
                schema: {
                  type: "object",
                  properties: {
                    success: { type: "boolean", example: true },
                    data: { type: "array", items: { "$ref": "#/components/schemas/SocialAccount" } }
                  }
                }
              }
            }
          },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/users/me/socials/{provider}": {
      delete: {
        tags: ["Users"], summary: "소셜 계정 연결 해제",
        parameters: [
          { name: "provider", in: "path", required: true, schema: { type: "string", enum: ["kakao", "naver", "apple"] } }
        ],
        responses: {
          204: { description: "연결 해제 성공" },
          401: { "$ref": "#/components/responses/Unauthorized" },
          404: { "$ref": "#/components/responses/NotFound" }
        }
      }
    },

    // ─── Invitation Templates ────────────────────────────────────────────
    "/invitation/templates": {
      get: {
        tags: ["Invitation Templates"], summary: "템플릿 목록 조회", security: [],
        parameters: [
          { name: "page", in: "query", schema: { type: "integer", default: 1 } },
          { name: "limit", in: "query", schema: { type: "integer", default: 20 } }
        ],
        responses: {
          200: {
            description: "성공 (isActive=true 필터)",
            content: {
              "application/json": {
                schema: {
                  type: "object",
                  properties: {
                    success: { type: "boolean", example: true },
                    data: { type: "array", items: { "$ref": "#/components/schemas/InvitationTemplate" } },
                    meta: { "$ref": "#/components/schemas/ApiMeta" }
                  }
                }
              }
            }
          }
        }
      },
      post: {
        tags: ["Invitation Templates"], summary: "템플릿 생성 (admin only)",
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object", required: ["name", "previewImageKey", "theme", "font"],
                properties: {
                  name: { type: "string", maxLength: 100 },
                  previewImageKey: { type: "string" },
                  theme: { type: "string" },
                  font: { type: "string" },
                  effect: { type: "string" },
                  isActive: { type: "boolean", default: true }
                }
              }
            }
          }
        },
        responses: {
          201: {
            description: "생성 성공",
            content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean", example: true }, data: { "$ref": "#/components/schemas/InvitationTemplate" } } } } }
          },
          401: { "$ref": "#/components/responses/Unauthorized" },
          403: { "$ref": "#/components/responses/Forbidden" }
        }
      }
    },
    "/invitation/templates/{id}": {
      get: {
        tags: ["Invitation Templates"], summary: "템플릿 단건 조회", security: [],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: {
          200: { description: "성공", content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean", example: true }, data: { "$ref": "#/components/schemas/InvitationTemplate" } } } } } },
          404: { "$ref": "#/components/responses/NotFound" }
        }
      },
      patch: {
        tags: ["Invitation Templates"], summary: "템플릿 수정 (admin only)",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                properties: {
                  name: { type: "string" }, theme: { type: "string" }, font: { type: "string" },
                  effect: { type: "string" }, isActive: { type: "boolean" }
                }
              }
            }
          }
        },
        responses: {
          200: { description: "수정 성공", content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean", example: true }, data: { "$ref": "#/components/schemas/InvitationTemplate" } } } } } },
          401: { "$ref": "#/components/responses/Unauthorized" },
          403: { "$ref": "#/components/responses/Forbidden" },
          404: { "$ref": "#/components/responses/NotFound" }
        }
      },
      delete: {
        tags: ["Invitation Templates"], summary: "템플릿 삭제 (admin only)",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: {
          204: { description: "삭제 성공" },
          401: { "$ref": "#/components/responses/Unauthorized" },
          403: { "$ref": "#/components/responses/Forbidden" },
          404: { "$ref": "#/components/responses/NotFound" }
        }
      }
    },

    // ─── Invitations ─────────────────────────────────────────────────────
    "/invitations": {
      get: {
        tags: ["Invitations"], summary: "내 초대장 목록 (userId는 JWT 추출)",
        parameters: [
          { name: "page", in: "query", schema: { type: "integer", default: 1 } },
          { name: "limit", in: "query", schema: { type: "integer", default: 20 } },
          { name: "status", in: "query", schema: { type: "string", enum: ["active", "closed"] } }
        ],
        responses: {
          200: {
            description: "성공",
            content: {
              "application/json": {
                schema: {
                  type: "object",
                  properties: {
                    success: { type: "boolean", example: true },
                    data: { type: "array", items: { "$ref": "#/components/schemas/Invitation" } },
                    meta: { "$ref": "#/components/schemas/ApiMeta" }
                  }
                }
              }
            }
          },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      },
      post: {
        tags: ["Invitations"], summary: "초대장 생성 (생성자는 HOST로 자동 participants 등록)",
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object", required: ["title", "description", "mainImageKey"],
                properties: {
                  templateId: { type: "string" },

                  content: { type: "string" },
                  parentId: { type: "string" }
                }
              }
            }
          }
        },
        responses: {
          201: { description: "작성 성공", content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean", example: true }, data: { "$ref": "#/components/schemas/Feedback" } } } } } },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/feedbacks/{id}": {
      patch: {
        tags: ["Feedbacks"], summary: "피드백 수정 (본인만)",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" }, description: "피드백 ID" }],
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object", required: ["content"],
                properties: { content: { type: "string" } }
              }
            }
          }
        },
        responses: {
          200: { description: "수정 성공", content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean", example: true }, data: { "$ref": "#/components/schemas/Feedback" } } } } } },
          401: { "$ref": "#/components/responses/Unauthorized" },
          403: { "$ref": "#/components/responses/Forbidden" },
          404: { "$ref": "#/components/responses/NotFound" }
        }
      },
      delete: {
        tags: ["Feedbacks"], summary: "피드백 삭제 soft delete (본인만)",
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" }, description: "피드백 ID" }],
        responses: {
          204: { description: "삭제 성공" },
          401: { "$ref": "#/components/responses/Unauthorized" },
          403: { "$ref": "#/components/responses/Forbidden" },
          404: { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/feedbacks/{feedbackId}/likes": {
      post: {
        tags: ["Feedbacks"], summary: "피드백 좋아요",
        parameters: [{ "$ref": "#/components/parameters/feedbackId" }],
        responses: {
          201: { description: "좋아요 성공" },
          401: { "$ref": "#/components/responses/Unauthorized" },
          409: { "$ref": "#/components/responses/Conflict" }
        }
      },
      delete: {
        tags: ["Feedbacks"], summary: "피드백 좋아요 취소",
        parameters: [{ "$ref": "#/components/parameters/feedbackId" }],
        responses: {
          204: { description: "좋아요 취소 성공" },
          401: { "$ref": "#/components/responses/Unauthorized" },
          404: { "$ref": "#/components/responses/NotFound" }
        }
      }
    },

    // ─── Notifications ────────────────────────────────────────────────────
    "/notifications": {
      get: {
        tags: ["Notifications"], summary: "알림 목록 (userId는 JWT 추출)",

        responses: {
          200: {
            description: "성공",
            content: {
              "application/json": {
                schema: {
                  type: "object",
                  properties: {
                    success: { type: "boolean", example: true },
                    data: { type: "array", items: { "$ref": "#/components/schemas/Notification" } },
                    meta: { "$ref": "#/components/schemas/ApiMeta" }
                  }
                }
              }
            }
          },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/notifications/unread": {
      get: {
        tags: ["Notifications"], summary: "읽지 않은 알림 수 조회",

          200: {
            description: "성공",
            content: {
              "application/json": {
                schema: {
                  type: "object",
                  properties: {
                    success: { type: "boolean", example: true },
                    data: { type: "object", properties: { count: { type: "integer", example: 3 } } }

                }
              }
            }
          },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/notifications/{id}/read": {
      patch: {

        responses: {
          200: { description: "읽음 처리 성공", content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean", example: true }, data: { "$ref": "#/components/schemas/Notification" } } } } } },
          401: { "$ref": "#/components/responses/Unauthorized" },
          404: { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/notifications/readAll": {
      patch: {
        tags: ["Notifications"], summary: "전체 알림 읽음 처리",
        responses: {
          200: { description: "전체 읽음 처리 성공", content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean", example: true }, data: { type: "object", properties: { updatedCount: { type: "integer" } } } } } } } },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/notifications/settings": {
      get: {
        tags: ["Notifications"], summary: "알림 설정 조회",
        responses: {
          200: { description: "성공", content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean", example: true }, data: { "$ref": "#/components/schemas/NotificationSettings" } } } } } },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      },
      patch: {
        tags: ["Notifications"], summary: "알림 설정 수정 (upsert)",
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                properties: {
                  isRemind: { type: "boolean" },
                  isFeedback: { type: "boolean" },
                  isInvitationDate: { type: "boolean" },
                  isPhoto: { type: "boolean" },
                  isMission: { type: "boolean" },
                  isParticipantLocations: { type: "boolean" },
                  isEventLocations: { type: "boolean" }
                }
              }
            }
          }
        },
        responses: {
          200: { description: "설정 수정 성공", content: { "application/json": { schema: { type: "object", properties: { success: { type: "boolean", example: true }, data: { "$ref": "#/components/schemas/NotificationSettings" } } } } } },
          401: { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    }
  }
};

SwaggerUIBundle({
  spec,

});
